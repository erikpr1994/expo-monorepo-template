# Dependabot for what Dependabot can't do: agent skills and the Expo SDK.
# Runs daily, checks the result, and commits it to main.
name: Update skills and Expo
on:
  schedule: [{ cron: "0 5 * * *" }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: npx -y skills@latest update -p -y
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo install expo@latest --fix
        working-directory: apps/mobile
      # Same packages for web, which Dependabot skips because they're shared with mobile.
      - run: pnpm --filter web up react react-dom @types/react @types/react-dom typescript
      # Pushes from GITHUB_TOKEN don't trigger CI, so check here before landing on main.
      - run: pnpm lint && pnpm build && pnpm check:mobile
      - run: |
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: update agent skills and Expo SDK"
          git push
