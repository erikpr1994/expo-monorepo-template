# Dependabot for agent skills: pulls upstream skill changes daily and commits them to main.
name: Update skills
on:
  schedule: [{ cron: "0 5 * * *" }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npx -y skills@latest update -p -y
      - run: |
          git add -A .claude/skills skills-lock.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(skills): update agent skills"
          git push
