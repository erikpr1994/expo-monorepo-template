version: 2
updates:
  # One entry for the whole pnpm workspace (the lockfile lives at the root).
  # Expo pins SDK-compatible versions of these; the "Update skills and Expo" workflow bumps them.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: daily }
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: "typescript"
      - dependency-name: "eslint-config-expo"
      # eslint-plugin-react (via eslint-config-expo) crashes on ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: daily }
    groups:
      minor-and-patch: { patterns: ["*"], update-types: [minor, patch] }
